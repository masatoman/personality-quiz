name: Frequent Supabase Health Check

on:
  schedule:
    # 6時間ごとに実行（1日4回）
    - cron: '0 */6 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  frequent-health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 コードチェックアウト
        uses: actions/checkout@v4
        
      - name: 📦 Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 📦 依存関係インストール
        run: npm ci
        
      - name: 🔍 拡張ヘルスチェック実行
        run: npm run health-check:enhanced
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          
      - name: 💬 Slack通知（失敗時のみ）
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '🚨 頻繁ヘルスチェック失敗 - Supabaseに問題があります。緊急確認が必要です！'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
