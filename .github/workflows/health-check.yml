name: Supabase Health Check

on:
  schedule:
    # 毎日午前9時（JST）に実行
    - cron: '0 0 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  health-check:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 コードチェックアウト
        uses: actions/checkout@v4
        
      - name: 📦 Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: 📦 依存関係インストール
        run: npm ci
        
      - name: 🔍 Supabaseヘルスチェック実行
        run: npm run health-check
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.PRODUCTION_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PRODUCTION_SUPABASE_ANON_KEY }}
          
      - name: 💬 Slack通知（成功）
        if: success()
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: '✅ Supabaseヘルスチェック成功 - 本番環境は正常です'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          
      - name: 💬 Slack通知（失敗）
        if: failure()
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          text: '❌ Supabaseヘルスチェック失敗 - 本番環境に問題があります。すぐに確認してください！'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
