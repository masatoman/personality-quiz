version: '3.9'

services:
  # PostgreSQL データベース
  postgres:
    image: postgres:15
    container_name: giver-english-postgres
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-scripts:/docker-entrypoint-initdb.d
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: giver_english_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Supabase REST API
  supabase-rest:
    image: postgrest/postgrest:latest
    container_name: giver-english-rest
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    command: ["postgrest", "/etc/postgrest.conf"]
    volumes:
      - ./docker/postgrest.conf:/etc/postgrest.conf
    ports:
      - "3005:3000"

volumes:
  postgres-data:
